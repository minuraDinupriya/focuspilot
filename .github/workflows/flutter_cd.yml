name: Flutter CD

on:
  push:
    tags:
      - 'v*' # Triggers on release tags like v0.4.0, v1.0.0

permissions:
  contents: read

jobs:
  verify-version:
    name: Check tag against app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        run: |
          version=$(sed -n 's/^version: \([^+]*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)
          test -n "$version" && test "v$version" = "$GITHUB_REF_NAME"

  build-android:
    name: Build Android demo
    needs: verify-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android demo APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk focuspilot-android-demo.apk
          sha256sum focuspilot-android-demo.apk > focuspilot-android-demo.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            focuspilot-android-demo.apk
            focuspilot-android-demo.apk.sha256
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Build Windows x64
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/distribution/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish Android and Windows downloads
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Verify release downloads
        run: sha256sum --check focuspilot-android-demo.apk.sha256 focuspilot-windows-x64.zip.sha256
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            focuspilot-android-demo.apk
            focuspilot-android-demo.apk.sha256
            focuspilot-windows-x64.zip
            focuspilot-windows-x64.zip.sha256
          fail_on_unmatched_files: true
          name: FocusPilot ${{ github.ref_name }}
          body: |
            On Windows x64, extract `focuspilot-windows-x64.zip` into a folder and open `focuspilot.exe`. Keep the DLLs and data folder beside it. The app requires the [Microsoft Visual C++ x64 Redistributable](https://aka.ms/vc14/vc_redist.x64.exe).

            On Android, download `focuspilot-android-demo.apk`. Both downloads have accompanying SHA-256 checksums.

            This demo uses an Android debug signing key. Installing over a previous build requires a matching signing key. Uninstalling an existing build deletes its local data.
          draft: false
          prerelease: false
          generate_release_notes: true
