name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-checks:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: Format, Analyze & Test (with Coverage)
            coverage-artifact: code-coverage-report
          - os: windows-latest
            check: Windows Tests & Release Build
            coverage-artifact: code-coverage-report-windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Run tests with code coverage
        run: flutter test --coverage

      - name: Upload code coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.coverage-artifact }}
          path: coverage/lcov.info

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Package Windows desktop
        if: runner.os == 'Windows'
        run: ./scripts/package-windows.ps1

      - name: Upload Windows build bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: focuspilot-windows-x64
          path: build/distribution/
          compression-level: 0
          if-no-files-found: error
